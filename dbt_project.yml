name: olist_analytics
version: "1.0.0"
config-version: 2
profile: olist_analytics
require-dbt-version: [">=1.9.0", "<2.0.0"]

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
clean-targets: ["target", "dbt_packages"]

vars:
  # Orders in these statuses never became a sale, so they earn no revenue.
  non_revenue_order_statuses: ["canceled", "unavailable"]
  # Range of the date dimension.
  date_spine_start: "2016-01-01"
  date_spine_end: "2019-01-01"

models:
  olist_analytics:
    # Silver: one view per source table. Cast, rename, deduplicate, hash PII.
    staging:
      +materialized: view
      +schema: staging
    # Silver: re-grain and combine staging models. Not exposed to BI.
    intermediate:
      +materialized: view
      +schema: intermediate
    # Gold: Kimball star schema. The only layer the REPORTER role can read.
    marts:
      +materialized: table
      +schema: marts
      # Access for the BI role: SELECT on every mart (grants) plus USAGE on the
      # schema, which Snowflake also needs and dbt grants do not cover (post-hook).
      +grants:
        select: ["REPORTER"]
      +post-hook: "grant usage on schema {{ this.database }}.{{ this.schema }} to role reporter"

seeds:
  olist_analytics:
    +schema: seeds

snapshots:
  olist_analytics:
    +schema: snapshots
