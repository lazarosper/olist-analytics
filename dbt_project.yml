name: olist_analytics
version: "1.0.0"
config-version: 2
profile: olist_analytics
require-dbt-version: [">=1.9.0", "<2.0.0"]

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
clean-targets: ["target", "dbt_packages"]

models:
  olist_analytics:
    # Silver: one view per source table. Cast, rename, deduplicate, hash PII.
    staging:
      +materialized: view
      +schema: staging

seeds:
  olist_analytics:
    +schema: seeds
