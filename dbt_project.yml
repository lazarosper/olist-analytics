name: olist_analytics
version: "1.0.0"
config-version: 2
profile: olist_analytics
require-dbt-version: [">=1.9.0", "<2.0.0"]

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
clean-targets: ["target", "dbt_packages"]

vars:
  # Orders in these statuses never became a sale, so they earn no revenue.
  non_revenue_order_statuses: ["canceled", "unavailable"]
  # Range of the date dimension.
  date_spine_start: "2016-01-01"
  date_spine_end: "2019-01-01"

# Governance as code: masking policies exist before any model is built, and the
# BI role gets schema access when (and only when) the marts have been built.
on-run-start:
  - "{{ create_masking_policies() }}"
on-run-end:
  - "{{ grant_marts_usage(schemas) }}"

models:
  olist_analytics:
    # Silver: one view per source table. Cast, rename, deduplicate, hash PII.
    staging:
      +materialized: view
      +schema: staging
    # Silver: re-grain and combine staging models. Not exposed to BI.
    intermediate:
      +materialized: view
      +schema: intermediate
    # Gold: Kimball star schema. The only layer the REPORTER role can read.
    marts:
      +materialized: table
      +schema: marts
      +grants:
        select: ["REPORTER"]

seeds:
  olist_analytics:
    +schema: seeds

snapshots:
  olist_analytics:
    +schema: snapshots
