# Runs before every local commit (one-time setup: pre-commit install).
# Cheap hygiene checks on the developer's machine. SQL linting (sqlfluff) and
# the dbt build run in CI, where they have a warehouse connection.
# Power BI rewrites its own project files on save, so they are left alone.
exclude: ^powerbi/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=1000"]
